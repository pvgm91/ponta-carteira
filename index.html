<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponta · Carteira de clientes e custos de visita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --va:#135352; --va-2:#0F4847; --va-3:#0A3938; --va-4:#072B2A;
  --vm:#A3C72E; --lar:#FF935F; --lar-2:#D67543; --azul:#6AD1E3; --ouro:#F1C100; --rosa:#FFC9AF;
  --camila:#A3C72E; --giovana:#FF935F;
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F7; --line:#D9E1DF; --line-2:#C3CECB;
  --text:#135352; --text-2:#3D4F4E; --muted:#5F6B6A;
  --ok:#2E8B57; --warn:#B7791F; --bad:#C2413A;
  --radius:10px; --radius-s:6px;
  --shadow:0 1px 2px rgba(7,43,42,.06),0 4px 16px rgba(7,43,42,.06);
  --font:'Sora', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#082625; --surface:#0E3534; --surface-2:#123E3D; --line:#1E5150; --line-2:#2A6261;
    --text:#FFFFFF; --text-2:#D8E4E2; --muted:#A9BDBA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#082625; --surface:#0E3534; --surface-2:#123E3D; --line:#1E5150; --line-2:#2A6261;
  --text:#FFFFFF; --text-2:#D8E4E2; --muted:#A9BDBA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--vm);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;min-height:0}
.app[hidden]{display:none}

/* ---------- barra superior ---------- */
.appbar{background:var(--va);color:#fff;display:flex;align-items:center;gap:28px;padding:0 24px;min-height:64px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand .sep{width:1px;height:28px;background:rgba(255,255,255,.25)}
.brand h1{font-size:15px;font-weight:600;margin:0;line-height:1.2;white-space:nowrap}
.brand h1 small{display:block;font-weight:400;font-size:12px;color:#CFE0DD}
.tabs{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:#CFE0DD;padding:21px 14px 19px;font-weight:500;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--vm);font-weight:600}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:#CFE0DD;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9D9D9C;display:inline-block}
.sync.cloud i{background:var(--vm)}
.sync.local i{background:var(--lar)}
.sync.pend i{background:#F1C100}
.sync.err i{background:#E5484D}

.view{display:none;flex:1;min-height:0}
.view.on{display:flex}

/* ---------- comum ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.h2{font-size:18px;font-weight:700;margin:0}
.h3{font-size:13px;font-weight:600;margin:0;color:var(--text-2)}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;color:var(--text)}
.btn:hover{border-color:var(--va)}
.btn.primary{background:var(--va);border-color:var(--va);color:#fff}
.btn.primary:hover{background:var(--va-2)}
.btn.accent{background:var(--vm);border-color:var(--vm);color:var(--va-4)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--text-2)}
.input,select.input,textarea.input{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.input:focus{border-color:var(--va);outline:none;box-shadow:0 0 0 3px rgba(163,199,46,.35)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:600;font-size:12.5px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--va);color:#fff}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px 5px 9px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.chip .cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--va);border-color:var(--va);color:#fff}
.chip[aria-pressed="true"] .cnt{color:#CFE0DD}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.cart-Camila{background:rgba(163,199,46,.22);color:#3F5310}
.tag.cart-Giovana{background:rgba(255,147,95,.22);color:#7A3512}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.cart-Camila{color:#D9F08A}:root:not([data-theme="light"]) .tag.cart-Giovana{color:#FFC4A6}}
:root[data-theme="dark"] .tag.cart-Camila{color:#D9F08A}:root[data-theme="dark"] .tag.cart-Giovana{color:#FFC4A6}
.tag.sit{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.tag.sit i{width:8px;height:8px;border-radius:50%;display:inline-block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.scroll{overflow:auto;min-height:0}
hr.div{border:0;border-top:1px solid var(--line);margin:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

/* ---------- mapa ---------- */
.map-layout{display:grid;grid-template-columns:268px minmax(0,1fr) 380px;flex:1;min-height:0}
.filters{background:var(--surface);border-right:1px solid var(--line);padding:18px 18px 24px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup .ghead{display:flex;justify-content:space-between;align-items:baseline}
.fgroup .ghead button{border:0;background:none;color:var(--muted);font-size:11.5px;padding:0}
.fgroup .ghead button:hover{color:var(--text)}
.mapwrap{position:relative;background:radial-gradient(ellipse at 60% 40%, #135352 0%, #0B3B3A 55%, #072B2A 100%);min-height:0;overflow:hidden}
.mapwrap svg{width:100%;height:100%;display:block;touch-action:none}
.state{fill:#18605F;stroke:#2C7A78;transition:fill .15s}
.state.has{fill:#1C6A68}
.state:hover{fill:#237A77}
.uf-label{fill:rgba(255,255,255,.5);font-size:10px;font-weight:600;pointer-events:none;letter-spacing:.04em}
.marker{cursor:pointer}
.marker path{stroke:#072B2A;stroke-width:1.4}
.marker.hollow path{fill:#072B2A !important;stroke-width:2.2}
.marker.aprox path{stroke-dasharray:3 2}
.marker.sel path{stroke:#fff;stroke-width:2.6}
.marker.dim{opacity:.18}
.cap-pin rect{fill:#072B2A;stroke:#CFE0DD;stroke-width:1}
.cap-pin text{font-size:10px;stroke-width:3px}
.cap-pin text{fill:#CFE0DD;font-weight:500;paint-order:stroke;stroke:#072B2A;stroke-linejoin:round;pointer-events:none}
.base-pin circle{fill:#fff;stroke:#072B2A;stroke-width:2}
.base-pin text{fill:#fff;font-size:11px;font-weight:700;paint-order:stroke;stroke:#072B2A;stroke-width:3px;stroke-linejoin:round}
.route-line{fill:none;stroke:var(--vm);stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-dasharray:6 5;stroke-linecap:round}
.route-air{fill:none;stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-dasharray:2 6;stroke-linecap:round;opacity:.8}
.stop-num circle{fill:var(--vm);stroke:#072B2A;stroke-width:1.5}
.stop-num text{fill:#072B2A;font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:central}
.map-top{position:absolute;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;pointer-events:none}
.map-top > *{pointer-events:auto}
.mapctl{display:flex;flex-direction:column;gap:6px}
.mapctl button{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(7,43,42,.9);color:#fff;font-size:18px;line-height:1}
.mapctl button:hover{background:#0F4847}
.colorby{background:rgba(7,43,42,.9);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.colorby .lbl{color:#CFE0DD}
.colorby .seg{background:transparent;border-color:rgba(255,255,255,.2)}
.colorby .seg button{color:#CFE0DD}
.colorby .seg button[aria-pressed="true"]{background:var(--vm);color:#072B2A}
.legend.min .lg:not(:first-child){display:none}
.legend .lgtog{position:absolute;right:8px;top:6px;border:0;background:none;color:#CFE0DD;font-size:11px;padding:2px 4px}
.legend{position:absolute;left:16px;bottom:16px;padding-right:56px !important;background:rgba(7,43,42,.9);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px 14px;color:#fff;font-size:12px;display:flex;gap:22px;max-width:calc(100% - 32px);flex-wrap:wrap}
.legend .lg{display:flex;flex-direction:column;gap:6px}
.legend .lg b{font-size:11px;color:#CFE0DD;font-weight:600}
.legend .it{display:flex;align-items:center;gap:7px;white-space:nowrap}
.legend svg{width:14px;height:14px;overflow:visible}
.tooltip{position:absolute;pointer-events:none;background:#fff;color:#135352;border-radius:8px;padding:9px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:260px;z-index:5;opacity:0;transition:opacity .12s}
.tooltip b{display:block;font-size:13px;margin-bottom:2px}
.side{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative}
.kpis{padding:18px 20px 14px;display:flex;flex-direction:column;gap:14px;border-bottom:1px solid var(--line)}
.kpi-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.stack-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--text-2)}
.stack-legend span{display:inline-flex;align-items:center;gap:5px}
.listhead{padding:12px 20px 8px;display:flex;gap:8px;align-items:center}
.clist{flex:1;overflow:auto;padding:0 10px 16px}
.clist .ufh{font-size:11.5px;font-weight:700;color:var(--muted);padding:12px 10px 6px;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:1}
.citem{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left}
.citem:hover{background:var(--surface-2)}
.citem.sel{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--vm)}
.citem .nm{font-weight:600;font-size:13px;line-height:1.25}
.citem .sub{font-size:11.5px;color:var(--muted)}
.citem svg{width:14px;height:14px;overflow:visible}
.detail{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;z-index:3}
.detail.open{transform:none}
.detail .dhead{background:var(--va);color:#fff;padding:16px 20px 18px;display:flex;flex-direction:column;gap:10px}
.detail .dhead .back{align-self:flex-start;border:0;background:none;color:#CFE0DD;padding:0;font-size:12.5px}
.detail .dhead h2{margin:0;font-size:20px;font-weight:700;line-height:1.2}
.detail .dhead .meta{color:#CFE0DD;font-size:12.5px}
.detail .dbody{padding:18px 20px 24px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px}
.ctable th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:6px 6px;border-bottom:1px solid var(--line)}
.ctable td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.hist-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hist-sum div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.hist-sum b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hist-sum span{font-size:11.5px;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:64px}
.months .m{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.months .m i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--line-2);min-height:2px}
.months .m.hot i{background:var(--vm)}
.months .m span{font-size:10px;color:var(--muted)}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable td,.ptable th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.ptable th{color:var(--muted);font-weight:600;font-size:11px}
.ptable .r{text-align:right;font-variant-numeric:tabular-nums}
.move-box{border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- roteiros ---------- */
.rt-layout{display:grid;grid-template-columns:420px minmax(0,1fr);flex:1;min-height:0}
.builder{background:var(--surface);border-right:1px solid var(--line);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.picker{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.picker .ph{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.picker .pl{max-height:250px;overflow:auto}
.pick{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:7px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick input{width:16px;height:16px;accent-color:#135352}
.pick .uf{font-size:11px;color:var(--muted)}
.pick.inroute{background:rgba(163,199,46,.08)}
.selected-list{display:flex;flex-direction:column;gap:4px}
.selrow{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--surface-2);font-size:13px}
.selrow .o{width:22px;height:22px;border-radius:50%;background:var(--vm);color:#072B2A;font-weight:800;font-size:11px;display:grid;place-items:center}
.selrow button{border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px}
.rt-main{display:grid;grid-template-rows:minmax(300px,46%) auto;min-height:0;overflow:auto}
.rt-map{position:relative;background:radial-gradient(ellipse at 60% 40%, #135352 0%, #0B3B3A 55%, #072B2A 100%);min-height:300px}
.rt-map svg{width:100%;height:100%;display:block}
.rt-results{padding:20px 24px 32px;display:flex;flex-direction:column;gap:18px}
.total-card{display:grid;grid-template-columns:minmax(220px,auto) 1fr;gap:28px;padding:22px 24px;align-items:center}
.total-card .big{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.total-card .sub{color:var(--muted);font-size:12.5px;margin-top:6px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:12.5px}
.bar .track{display:block;height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--va);border-radius:999px}
.bar .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cmp .card{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.cmp .card.best{border-color:var(--vm);box-shadow:0 0 0 2px rgba(163,199,46,.35)}
.cmp .o{font-size:12px;color:var(--muted);font-weight:600}
.cmp .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;background:var(--vm);color:#072B2A;border-radius:999px;padding:2px 8px}
.otable{width:100%;border-collapse:collapse;font-size:12.5px}
.otable th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;padding:8px 8px;border-bottom:1px solid var(--line)}
.otable td{padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.otable tr.cur td{background:rgba(163,199,46,.10)}
.otable td.r,.otable th.r{text-align:right}
.saved-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.saved-sum .card{padding:14px 16px}
.saved-sum .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%}

/* ---------- tabelas de página ---------- */
.page{flex:1;overflow:auto;padding:24px 28px 40px}
.page-inner{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:720px}
.dtable-wrap{overflow:auto}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:1;white-space:nowrap}
.dtable td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.dtable tr:hover td{background:var(--surface-2)}
.dtable .r{text-align:right}
.dtable input.cell{width:110px;text-align:right;border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.dtable input.cell.changed{border-color:var(--vm);background:rgba(163,199,46,.10)}
.cart-select{border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--surface)}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.cfg-card{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.cfg-row{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:center}
.cfg-row .d{font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400}
.cfg-row .unit{position:relative}
.cfg-row .unit input{padding-right:46px;text-align:right}
.cfg-row .unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}

/* ---------- login ---------- */
.login{position:fixed;inset:0;z-index:100;background:#135352;color:#fff;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;padding:40px 7vw calc(40px + env(safe-area-inset-bottom,0px));gap:6vw;overflow:auto}
.login.hide{display:none}
.login .lbrand{display:flex;flex-direction:column;gap:14px;max-width:560px}
.login .lbrand .pre{font-size:clamp(16px,1.6vw,24px);font-weight:700;color:#fff}
.login .lbrand .pre i{color:#A3C72E;font-style:normal;font-weight:400}
.login .lbrand .pre b{color:#A3C72E}
.login .lbrand img{width:100%;max-width:520px;height:auto;display:block}
.login .lbrand .tag{align-self:flex-end;font-size:clamp(15px,1.5vw,22px);font-weight:700;line-height:1.25;text-align:left;margin-right:6%}
.login form{display:flex;flex-direction:column;gap:22px;max-width:520px;width:100%;justify-self:end}
.login .fh{display:flex;justify-content:space-between;align-items:baseline}
.login h2{margin:0;font-size:34px;font-weight:500;letter-spacing:.01em}
.login .fh span{color:#CFE0DD;font-size:14px}
.login .in{display:flex;border:2px solid #A3C72E;border-radius:10px;overflow:hidden;background:transparent}
.login .in input{flex:1;background:transparent;border:0;color:#fff;padding:16px 18px;font-size:16px;min-width:0}
.login .in input::placeholder{color:#E3EEEC}
.login .in input:focus{outline:none}
.login .in:focus-within{box-shadow:0 0 0 3px rgba(163,199,46,.35)}
.login .in button{background:#A3C72E;border:0;width:58px;display:grid;place-items:center;color:#135352}
.login .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px}
.login .row label{display:flex;align-items:center;gap:10px}
.login .row input{width:18px;height:18px;accent-color:#A3C72E}
.login .row a{color:#fff;text-decoration:none}
.login .row a:hover{text-decoration:underline}
.login .go{align-self:center;background:#A3C72E;color:#135352;border:0;border-radius:6px;font-weight:700;font-size:16px;padding:14px 0;width:min(240px,60%)}
.login .go:disabled{opacity:.6;cursor:wait}
.login .err{min-height:20px;color:#FFC9AF;font-size:14px;text-align:center}
.login .foot{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;font-weight:600;color:#fff}
.logout{border:1px solid rgba(255,255,255,.25);background:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600}
.logout:hover{background:rgba(255,255,255,.08)}
@media (max-width:860px){ .login{grid-template-columns:1fr;padding:32px 24px 72px;align-content:start} .login form{justify-self:stretch} .login .lbrand .tag{align-self:flex-start} }

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(7,43,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-back.open{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100% - 40px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mb{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal .mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.ac-list{border:1px solid var(--line);border-radius:8px;max-height:180px;overflow:auto;display:none}
.ac-list.open{display:block}
.ac-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;font-size:13px}
.ac-list button:hover,.ac-list button:focus{background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--va-4);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .2s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mob-toggle{display:none}

@media (max-width:1180px){
  .map-layout{grid-template-columns:240px minmax(0,1fr)}
  .side{position:fixed;right:0;top:64px;bottom:0;width:min(380px,100%);z-index:15;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
  .side.mob-open{transform:none}
  .mob-toggle{display:inline-flex}
}
@media (max-width:860px){
  .appbar{padding:0 14px;gap:10px}
  .brand h1{display:none}.brand .sep{display:none}
  .map-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(420px,1fr)}
  .filters{border-right:0;border-bottom:1px solid var(--line);max-height:42vh}
  .rt-layout{grid-template-columns:1fr}
  .builder{border-right:0;border-bottom:1px solid var(--line)}
  .total-card{grid-template-columns:1fr}
  .cmp{grid-template-columns:1fr}
  .page{padding:16px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>

/* =====================================================================
   COMPARTILHAMENTO PELO GITHUB
   Os dados da equipe ficam em dados/carteira.enc.json, no branch "dados"
   do repositório, cifrados com a mesma chave que protege os clientes.
   Ler: qualquer pessoa logada. Gravar: quem colou um token com Contents: Read and write.
   ===================================================================== */
const GH = {owner:'pvgm91', repo:'ponta-carteira', branch:'dados', base:'main', path:'dados/carteira.enc.json'};
const GH_TOKEN_KEY='ponta-carteira-gh-token', GH_STATE_KEY='ponta-carteira-gh-pendente';
let DATA_KEY=null;
const ghB64=txt=>b64e(te.encode(txt));
const ghUnB64=b64=>td.decode(b64d(String(b64).replace(/\s/g,'')));
const Sync = {
  token:'', sha:null, quando:null, dirty:{}, full:false, busy:false, again:false, timer:null, lastPull:0, keyErr:false, erro:'', started:false,
  loadPrefs(){
    try{ this.token=localStorage.getItem(GH_TOKEN_KEY)||''; }catch(e){}
    let raw=null; try{ raw=localStorage.getItem(GH_STATE_KEY); }catch(e){}
    if(raw===null){
      /* primeira vez com o compartilhamento: o que já estava neste navegador entra como alteração a enviar */
      Object.keys(S.overrides||{}).forEach(id=>this.dirty['overrides/'+id]='set');
      Object.keys(S.roteiros||{}).forEach(id=>this.dirty['roteiros/'+id]='set');
      this.savePrefs(); return;
    }
    try{ const d=JSON.parse(raw)||{}; this.dirty=d.dirty||{}; this.full=!!d.full; this.sha=d.sha||null; this.quando=d.quando||null; }catch(e){}
  },
  savePrefs(){ try{ localStorage.setItem(GH_STATE_KEY, JSON.stringify({dirty:this.dirty,full:this.full,sha:this.sha,quando:this.quando})); }catch(e){} },
  pendentes(){ return this.full?1:Object.keys(this.dirty).length; },
  headers(){ const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; if(this.token) h.Authorization='Bearer '+this.token; return h; },
  api(p){ return `https://api.github.com/repos/${GH.owner}/${GH.repo}/${p}`; },
  async erroHttp(r,acao){
    if(r.status===401) return new Error(this.token?'O GitHub não reconheceu o token. Gere outro e cole inteiro.':'O GitHub recusou o acesso (401).');
    if(r.status===403||r.status===429){
      if(r.headers.get('x-ratelimit-remaining')==='0') return new Error('Limite de consultas do GitHub atingido. Tento de novo em alguns minutos.');
      return new Error(this.token?'O token não tem permissão de escrita neste repositório (Contents: Read and write).':'O GitHub recusou o acesso (403).');
    }
    const t=await r.text().catch(()=>''); return new Error(`GitHub respondeu ${r.status} ao ${acao}: ${t.slice(0,120)}`);
  },
  async cifrar(obj){
    const key=await crypto.subtle.importKey('raw',DATA_KEY,'AES-GCM',false,['encrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(JSON.stringify(obj))));
    return JSON.stringify({app:'ponta-carteira-dados',v:1,em:new Date().toISOString(),iv:b64e(iv),ct:b64e(ct)});
  },
  async decifrar(txt){
    const env=JSON.parse(txt);
    const key=await crypto.subtle.importKey('raw',DATA_KEY,'AES-GCM',false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(env.iv)},key,b64d(env.ct));
    return JSON.parse(td.decode(pt));
  },
  /* {sha, dados} | {sha, dados:null, keyErr:true} | null (ainda não existe) */
  async buscar(){
    const r=await fetch(this.api(`contents/${GH.path}?ref=${GH.branch}&_=${Date.now()}`),{headers:this.headers(),cache:'no-store'});
    if(r.status===404) return null;
    if(!r.ok) throw await this.erroHttp(r,'buscar os dados');
    const arq=await r.json();
    let txt=arq.content?ghUnB64(arq.content):'';
    if(!txt && arq.download_url){ const d=await fetch(arq.download_url+'?_='+Date.now(),{cache:'no-store'}); txt=await d.text(); }
    try{ return {sha:arq.sha, dados:await this.decifrar(txt)}; }
    catch(e){ return {sha:arq.sha, dados:null, keyErr:true}; }
  },
  async garantirBranch(){
    const r=await fetch(this.api(`git/ref/heads/${GH.branch}`),{headers:this.headers(),cache:'no-store'});
    if(r.ok) return;
    if(r.status!==404) throw await this.erroHttp(r,'conferir o branch de dados');
    const m=await fetch(this.api(`git/ref/heads/${GH.base}`),{headers:this.headers(),cache:'no-store'});
    if(!m.ok) throw await this.erroHttp(m,'ler o branch principal');
    const sha=(await m.json()).object.sha;
    const c=await fetch(this.api('git/refs'),{method:'POST',headers:{...this.headers(),'Content-Type':'application/json'},body:JSON.stringify({ref:'refs/heads/'+GH.branch,sha})});
    if(!c.ok && c.status!==422) throw await this.erroHttp(c,'criar o branch de dados');
  },
  foto(){ return JSON.parse(JSON.stringify({overrides:S.overrides,roteiros:S.roteiros,cfg:S.cfg,fares:S.fares,extraDest:S.extraDest})); },
  /* aplica sobre "alvo" as alterações locais ainda não enviadas */
  sobrepor(alvo,local,dirty){
    alvo.overrides=alvo.overrides||{}; alvo.roteiros=alvo.roteiros||{};
    Object.keys(dirty).forEach(p=>{
      const op=dirty[p], i=p.indexOf('/'), tipo=p.slice(0,i), id=p.slice(i+1);
      if(p==='app/config'){ alvo.cfg=local.cfg; return; }
      if(p==='app/fares'){ alvo.fares=local.fares; alvo.extraDest=local.extraDest; return; }
      if(tipo==='overrides'||tipo==='roteiros'){
        if(op==='del'||local[tipo][id]===undefined) delete alvo[tipo][id]; else alvo[tipo][id]=local[tipo][id];
      }
    });
    return alvo;
  },
  usar(d){
    S.overrides=d.overrides||{}; S.roteiros=d.roteiros||{};
    S.cfg={...CFG_DEFAULT,...(d.cfg||{})}; S.fares=mergeFares(d.fares||{}); S.extraDest=d.extraDest||[];
    Store.saveLocal(); applyOverrides(); refresh();
  },
  status(){
    if(Store.mode==='cloud') return;
    const el=$('#sync'); if(!el) return;
    const n=this.pendentes(); let cls='sync ', txt;
    if(this.busy){ cls+='pend'; txt='Sincronizando com a equipe…'; }
    else if(this.erro){ cls+='err'; txt=this.erro; }
    else if(this.keyErr){ cls+='err'; txt='Versão da equipe gravada com outros acessos'; }
    else if(!this.token){ cls+='local'; txt=n?`${n} alteração(ões) só neste navegador`:'Lendo a versão da equipe'; }
    else if(n){ cls+='pend'; txt='Alterações ainda não enviadas'; }
    else { cls+='cloud'; txt='Salvo e compartilhado com a equipe'; }
    el.className=cls; el.querySelector('span').textContent=txt;
    el.title=txt+' · clique para ver o compartilhamento';
  },
  marcar(path,op){
    this.dirty[path]=op; this.savePrefs(); this.status();
    if(this.token){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.enviar(),2500); }
  },
  substituirTudo(){ this.full=true; this.dirty={}; this.savePrefs(); this.status(); if(this.token) this.enviar(); },
  async puxar(silencioso){
    if(this.busy){ return; }
    this.busy=true; this.lastPull=Date.now();
    try{
      const rem=await this.buscar(); this.erro='';
      if(!rem){ this.keyErr=false; if(this.token){ this.full=true; this.savePrefs(); } }
      else if(rem.keyErr){ this.keyErr=true; }
      else {
        this.keyErr=false;
        if(rem.sha!==this.sha || this.pendentes()){
          const local=this.foto();
          const alvo=this.full?local:this.sobrepor(rem.dados,local,this.dirty);
          this.usar(alvo);
        }
        this.sha=rem.sha; this.quando=Date.now(); this.savePrefs();
      }
      if(!silencioso) toast(rem?(rem.keyErr?'A versão da equipe não abre com estes acessos.':'Versão da equipe carregada.'):'Ainda não há versão da equipe no GitHub.');
    }catch(e){ this.erro=e.message; if(!silencioso) toast(e.message); }
    finally{ this.busy=false; this.status(); }
    if(this.token && this.pendentes() && !this.keyErr) await this.enviar();
  },
  async enviar(forcar){
    if(!this.token){ this.status(); return false; }
    if(this.busy){ this.again=true; return false; }
    clearTimeout(this.timer); this.busy=true; this.status();
    let ok=false;
    try{
      for(let tent=0; tent<4 && !ok; tent++){
        const rem=await this.buscar();
        if(rem && rem.keyErr && !forcar){
          this.keyErr=true;
          throw new Error('A versão da equipe foi gravada com outros acessos. Abra o compartilhamento para decidir.');
        }
        if(!rem) await this.garantirBranch();
        const dirty={...this.dirty}, full=this.full, local=this.foto();
        const alvo=(full||!rem||!rem.dados)?local:this.sobrepor(rem.dados,local,dirty);
        const corpo={message:'carteira: atualização pelo app',content:ghB64(await this.cifrar(alvo)),branch:GH.branch};
        if(rem) corpo.sha=rem.sha;
        const r=await fetch(this.api('contents/'+GH.path),{method:'PUT',headers:{...this.headers(),'Content-Type':'application/json'},body:JSON.stringify(corpo)});
        if(r.status===409||r.status===422){ await new Promise(s=>setTimeout(s,600+Math.random()*900)); continue; }
        if(!r.ok) throw await this.erroHttp(r,'salvar');
        const resp=await r.json();
        /* o que mudou durante o envio continua pendente */
        Object.keys(dirty).forEach(k=>{ if(this.dirty[k]===dirty[k]) delete this.dirty[k]; });
        if(full) this.full=false;
        this.usar(this.sobrepor(JSON.parse(JSON.stringify(alvo)),this.foto(),this.dirty));
        this.sha=resp.content.sha; this.quando=Date.now(); this.keyErr=false; this.erro=''; this.savePrefs(); ok=true;
      }
      if(!ok) throw new Error('Outra pessoa estava salvando ao mesmo tempo. Tento de novo em instantes.');
    }catch(e){
      this.erro=e.message;
      if(e instanceof TypeError||/mesmo tempo|Limite/.test(e.message)){ clearTimeout(this.timer); this.timer=setTimeout(()=>{ this.erro=''; this.enviar(); },30000); }
    }
    finally{ this.busy=false; this.status(); }
    if(this.again){ this.again=false; if(this.pendentes()) this.enviar(); }
    return ok;
  },
  async testar(log){
    if(!this.token){ log('Cole o token no campo acima.',true); return; }
    try{
      log('Identificando o token…');
      const u=await fetch('https://api.github.com/user',{headers:this.headers(),cache:'no-store'});
      if(u.status===401){ log('O GitHub não reconheceu este token (401). Gere outro e cole inteiro.',true); return; }
      if(!u.ok){ log('GitHub respondeu '+u.status+' ao identificar o token.',true); return; }
      const conta=(await u.json()).login;
      log(`Token da conta ${conta}. Testando escrita…`);
      await this.garantirBranch();
      const alvo=`dados/.teste-${Date.now()}.txt`;
      const put=await fetch(this.api('contents/'+alvo),{method:'PUT',headers:{...this.headers(),'Content-Type':'application/json'},body:JSON.stringify({message:'teste de permissão do token',content:ghB64('ok'),branch:GH.branch})});
      if(put.status===403||put.status===404){ log(`O token lê, mas não grava em ${GH.owner}/${GH.repo}. Confira: Repository access → Only select repositories → ${GH.repo}, e Permissions → Contents: Read and write.`,true); return; }
      if(!put.ok){ log('GitHub respondeu '+put.status+' no teste de escrita.',true); return; }
      const criado=await put.json();
      await fetch(this.api('contents/'+alvo),{method:'DELETE',headers:{...this.headers(),'Content-Type':'application/json'},body:JSON.stringify({message:'remove teste',sha:criado.content.sha,branch:GH.branch})}).catch(()=>{});
      log(`Tudo certo: o token da conta ${conta} consegue salvar para a equipe.`);
    }catch(e){ log(e.message,true); }
  },
  abrir(){
    const q=this.quando?new Date(this.quando).toLocaleString('pt-BR'):'nunca';
    openModal(`<div class="mh"><span class="h2">Compartilhar com a equipe</span></div>
    <div class="mb" style="display:flex;flex-direction:column;gap:12px">
      <div class="small">Os dados da equipe ficam no GitHub (<b>${GH.owner}/${GH.repo}</b>), cifrados com a mesma chave do login. Todo mundo que entra vê a mesma versão. Para <b>salvar</b> para todos, cole um token do GitHub uma vez neste navegador.</div>
      ${this.keyErr?`<div class="note" style="border-color:#E5484D">A versão salva no GitHub foi cifrada com outros acessos (o index.html foi gerado de novo). Ela não abre aqui. Se você tem a versão certa neste navegador, use <b>Substituir a da equipe pela minha</b>.</div>`:''}
      <label class="small" for="ghTok"><b>Token de acesso</b> (fine-grained, só este repositório, Contents: Read and write)</label>
      <div style="display:flex;gap:8px"><input class="input" type="password" id="ghTok" placeholder="github_pat_..." autocomplete="off" spellcheck="false" value="${esc(this.token)}"><button class="btn" id="ghOlho" type="button">Mostrar</button></div>
      <div class="small muted">O token fica guardado só neste navegador. Não vai para o GitHub, nem para o backup. Última sincronização: ${q}. Alterações pendentes: ${this.pendentes()}.</div>
      <div class="note" id="ghLog" style="min-height:1em">${esc(this.erro||'')}</div>
    </div>
    <div class="mf" style="flex-wrap:wrap">
      <button class="btn" id="ghEsq">Esquecer token</button><button class="btn" id="ghTest">Testar token</button>
      ${this.keyErr&&this.token?'<button class="btn" id="ghForce">Substituir a da equipe pela minha</button>':''}
      <span style="flex:1"></span>
      <button class="btn" id="ghPull">Buscar agora</button><button class="btn primary" id="ghSave">Salvar</button>
    </div>`);
    const log=(t,err)=>{ const el=$('#ghLog'); if(el){ el.textContent=t; el.style.color=err?'#E5484D':''; } };
    const ler=()=>{ const v=$('#ghTok').value.trim(); if(v!==this.token){ this.token=v; try{ v?localStorage.setItem(GH_TOKEN_KEY,v):localStorage.removeItem(GH_TOKEN_KEY); }catch(e){} } };
    $('#ghOlho').onclick=()=>{ const i=$('#ghTok'); const s=i.type==='password'; i.type=s?'text':'password'; $('#ghOlho').textContent=s?'Ocultar':'Mostrar'; };
    $('#ghEsq').onclick=()=>{ $('#ghTok').value=''; ler(); this.status(); log('Token apagado deste navegador.'); };
    $('#ghTest').onclick=async()=>{ ler(); await this.testar(log); };
    $('#ghPull').onclick=async()=>{ ler(); log('Buscando…'); await this.puxar(true); log(this.erro||(this.keyErr?'A versão da equipe não abre com estes acessos.':'Versão da equipe carregada.'),!!this.erro||this.keyErr); };
    $('#ghSave').onclick=async()=>{ ler(); if(!this.token){ log('Sem token, as alterações ficam só neste navegador.',true); return; } log('Salvando…'); const ok=await this.enviar(); log(ok?'Salvo. Todo mundo já vê esta versão.':(this.erro||'Não foi possível salvar.'),!ok); };
    const f=$('#ghForce'); if(f) f.onclick=async()=>{ if(!confirm('Substituir a versão da equipe pela deste navegador? A versão atual do GitHub fica só no histórico.')) return; this.full=true; this.savePrefs(); log('Salvando…'); const ok=await this.enviar(true); log(ok?'Versão da equipe substituída.':(this.erro||'Não foi possível salvar.'),!ok); };
  },
  start(){
    if(this.started) return; this.started=true;
    this.loadPrefs(); this.status();
    const el=$('#sync'); el.style.cursor='pointer'; el.setAttribute('role','button'); el.tabIndex=0;
    el.onclick=()=>this.abrir(); el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); this.abrir(); } };
    this.puxar(true);
    const talvez=()=>{ if(document.visibilityState!=='visible'||this.busy) return; if(Date.now()-this.lastPull>(this.token?40000:180000)) this.puxar(true); };
    setInterval(talvez,20000);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && Date.now()-this.lastPull>15000) this.puxar(true); });
  }
};

function passes(c, f=S.f, ignore){
  if(ignore!=='cart' && f.cart.size && !f.cart.has(c.cart)) return false;
  if(ignore!=='sol' && f.sol.size && !f.sol.has(c.sol)) return false;
  if(ignore!=='tipo' && f.tipo.size && !f.tipo.has(c.tipo)) return false;
  if(ignore!=='sit' && f.sit.size && !f.sit.has(c.sit)) return false;
  if(ignore!=='uf' && f.uf.size && !f.uf.has(c.uf)) return false;
  if(ignore!=='op' && f.op.size && !f.op.has(c.op||'Sem informação')) return false;
  if(f.andamento && !(c.andamento && c.andamento.length)) return false;
  if(f.q){ const q=norm(f.q); if(!(norm(c.n).includes(q)||norm(c.faz).includes(q)||norm(c.org).includes(q)||norm(c.cidade).includes(q)||norm(c.uf)===q)) return false; }
  return true;
}
function filtered(){ return clients.filter(c=>passes(c)); }
function colorOf(c, by=S.colorBy){
  if(by==='sit') return (SIT[c.sit]||SIT['Sem contrato']).cor;
  if(by==='sol') return (SOL[c.sol]||{cor:'#ccc'}).cor;
  return (CART[c.cart]||{cor:'#ccc'}).cor;
}
function symPath(tipo,size){ const t=TIPO_SYM[tipo]||'circle'; const m={circle:d3.symbolCircle,diamond:d3.symbolDiamond,square:d3.symbolSquare,star:d3.symbolStar};
  const s = t==='diamond'? size*1.25 : t==='star'? size*1.35 : t==='square'? size*0.9 : size;
  return d3.symbol().type(m[t]).size(s)(); }

    ${groups.map(g=>{

      return `<div class="fgroup"><div class="ghead"><span class="h3">${g.t}</span>${fsel(g.k).size?`<button data-clear="${g.k}">Limpar</button>`:''}</div>

        ${it.sw?`<span class="sw" style="background:${it.sw}"></span>`:''}${it.sym?legendSym(it.sym,'currentColor'):''}${esc(it.label)} <span class="cnt">${counts[it.v]||0}</span></button>`).join('')}</div></div>`;

    <div class="note"><b>Serviço</b> (Resultado ou Supervisão de Ponta) já inclui a anuidade. <b>Anuidade</b> é o cliente sem serviço. Contratos da planilha de planejamento; provas do Controle Efficiency. Corrija um cliente pelo botão <b>Editar</b>.</div>`;
  $$('.chip',el).forEach(b=>b.onclick=()=>{ const k=b.dataset.f, v=b.dataset.v; const s=S.f[k]; s.has(v)?s.delete(v):s.add(v); renderMapPage(); });

function legendSym(tipo,color){
  const p=symPath(tipo,90); const hollow=tipo==='Sem contrato';
  return `<svg viewBox="-8 -8 16 16" width="13" height="13" style="overflow:visible;flex:none"><path d="${p}" fill="${hollow?'none':color}" stroke="${color}" stroke-width="${hollow?1.8:0}"/></svg>`;
}

/* =====================================================================
   MAPA PRINCIPAL
   ===================================================================== */
const MapView = {
  svg:null, g:null, proj:null, zoom:null, k:1, t:null, inited:false, raf:0,
  init(){
    const svg=d3.select('#map'); this.svg=svg;
    const {width,height}=$('#mapwrap').getBoundingClientRect();
    this.w=width||900; this.h=height||700;
    svg.attr('viewBox',`0 0 ${this.w} ${this.h}`);
    this.proj=d3.geoMercator().fitExtent([[40,70],[this.w-40,this.h-90]],GEO);
    const path=d3.geoPath(this.proj); this.path=path;
    const g=svg.append('g'); this.g=g;
    this.gStates=g.append('g').attr('stroke-width',0.8);
    const ov=svg.append('g'); this.ov=ov;
    this.gLabels=ov.append('g'); this.gCaps=ov.append('g'); this.gBases=ov.append('g'); this.gMarkers=ov.append('g');
    this.gStates.selectAll('path').data(GEO.features).join('path').attr('class','state').attr('d',path)
      .on('mousemove',(e,d)=>this.stateTip(e,d)).on('mouseleave',()=>hideTip())
      .on('click',(e,d)=>{ const uf=d.properties.uf; S.f.uf.has(uf)?S.f.uf.delete(uf):S.f.uf.add(uf); renderMapPage(); });
    this.gLabels.selectAll('text').data(GEO.features).join('text').attr('class','uf-label').attr('text-anchor','middle').text(d=>d.properties.uf)
      .each(function(d){ const c=path.centroid(d); this._x=c[0]; this._y=c[1]; });
    this.t=d3.zoomIdentity;
    this.zoom=d3.zoom().scaleExtent([1,60]).on('zoom',e=>{ this.t=e.transform; this.k=e.transform.k;
      if(!this.raf) this.raf=requestAnimationFrame(()=>{ this.raf=0; this.g.attr('transform',this.t); this.gStates.attr('stroke-width',0.8/this.k); this.place(); }); });
    svg.call(this.zoom).on('dblclick.zoom',null);
    $('#zin').onclick=()=>svg.transition().duration(250).call(this.zoom.scaleBy,1.6);
    $('#zout').onclick=()=>svg.transition().duration(250).call(this.zoom.scaleBy,1/1.6);
    $('#zreset').onclick=()=>svg.transition().duration(350).call(this.zoom.transform,d3.zoomIdentity);
    this.inited=true;
    new ResizeObserver(()=>{ const r=$('#mapwrap').getBoundingClientRect(); if(r.width && (Math.abs(r.width-this.w)>40||Math.abs(r.height-this.h)>40)){ this.rebuild(); } }).observe($('#mapwrap'));
  },
  rebuild(){ d3.select('#map').selectAll('*').remove(); this.inited=false; this.k=1; this.init(); this.render(); },
  positions(list){
    const groups={}; list.forEach(c=>{ const k=c.lat.toFixed(3)+','+c.lon.toFixed(3); (groups[k]=groups[k]||[]).push(c); });
    const pos={};
    Object.values(groups).forEach(arr=>{ const [x,y]=this.proj([arr[0].lon,arr[0].lat]);
      if(arr.length===1){ pos[arr[0].id]={x,y,dx:0,dy:0}; return; }
      arr.forEach((c,i)=>{ const a=(i/arr.length)*Math.PI*2-Math.PI/2; const r=9+arr.length*1.2; pos[c.id]={x,y,dx:Math.cos(a)*r,dy:Math.sin(a)*r}; });
    });
    return pos;
  },
  render(){
    if(!this.inited) return;
    const list=clients; const fl=filtered(); const vis=new Set(fl.map(c=>c.id));
    const pos=this.positions(list); this.pos=pos;
    const counts={}; fl.forEach(c=>counts[c.uf]=(counts[c.uf]||0)+1);
    this.gStates.selectAll('path').classed('has',d=>!!counts[d.properties.uf])
      .style('fill',d=> S.f.uf.has(d.properties.uf)?'#2A8784':null);
    const m=this.gMarkers.selectAll('g.marker').data(list,d=>d.id);
    const me=m.enter().append('g').attr('class','marker').attr('tabindex',0).attr('role','button');
    me.append('line').attr('class','leader').attr('stroke','rgba(255,255,255,.35)');
    me.append('path');
    me.on('mousemove',(e,d)=>this.markerTip(e,d)).on('mouseleave',()=>hideTip())
      .on('click',(e,d)=>{ e.stopPropagation(); selectClient(d.id,false); })
      .on('keydown',(e,d)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); selectClient(d.id,false); } });
    m.exit().remove();
    const all=this.gMarkers.selectAll('g.marker');
    all.attr('aria-label',d=>`${d.n}, ${d.cidade||d.uf}, carteira ${d.cart}, ${d.sit}`)
      .classed('dim',d=>!vis.has(d.id)).classed('sel',d=>S.selected===d.id)
      .classed('hollow',d=>d.tipo==='Sem contrato').classed('aprox',d=>d.aprox);
    all.select('path').attr('d',d=>symPath(d.tipo, S.selected===d.id?240:150)).attr('fill',d=>colorOf(d)).style('stroke',d=>d.tipo==='Sem contrato'?colorOf(d):null);
    all.select('line').attr('x1',0).attr('y1',0).attr('x2',d=>-(pos[d.id]||{}).dx||0).attr('y2',d=>-(pos[d.id]||{}).dy||0).style('display',d=>(pos[d.id]||{}).dx?null:'none');
    all.sort((a,b)=>(vis.has(a.id)?1:0)-(vis.has(b.id)?1:0) || (S.selected===a.id?1:0)-(S.selected===b.id?1:0));
    const caps=S.showCaps?CAPS:[];
    const cp=this.gCaps.selectAll('g.cap-pin').data(caps,d=>d.uf);
    const cpe=cp.enter().append('g').attr('class','cap-pin');
    cpe.append('rect').attr('x',-3.2).attr('y',-3.2).attr('width',6.4).attr('height',6.4).attr('transform','rotate(45)');
    cpe.append('text').attr('x',6).attr('dy','0.35em').text(d=>d.nome);
    cpe.append('title').text(d=>`${d.nome} (capital, ${d.uf})`);
    cpe.each(function(d){ const p=MapView.proj([d.longitude,d.latitude]); this._x=p[0]; this._y=p[1]; });
    cp.exit().remove();
    const bases=S.showBases?Object.values(ORIGENS):[];
    const b=this.gBases.selectAll('g.base-pin').data(bases,d=>d.id);
    const be=b.enter().append('g').attr('class','base-pin');
    be.append('circle').attr('r',5); be.append('text').attr('x',8).attr('dy','0.35em').text(d=>d.nome);
    be.each(function(d){ const p=MapView.proj([d.lon,d.lat]); this._x=p[0]; this._y=p[1]; });
    b.exit().remove();
    this.place();
  },
  place(){
    const t=this.t||d3.zoomIdentity, k=t.k, pos=this.pos||{};
    this.gMarkers.selectAll('g.marker').attr('transform',d=>{ const p=pos[d.id]; return p?`translate(${t.applyX(p.x)+p.dx},${t.applyY(p.y)+p.dy})`:null; });
    this.gLabels.style('display',k>6?'none':null);
    if(k<=6) this.gLabels.selectAll('text').attr('x',function(){return t.applyX(this._x);}).attr('y',function(){return t.applyY(this._y);});
    this.gCaps.selectAll('g.cap-pin').attr('transform',function(){ return `translate(${t.applyX(this._x)},${t.applyY(this._y)})`; });
    this.gBases.selectAll('g.base-pin').attr('transform',function(){ return `translate(${t.applyX(this._x)},${t.applyY(this._y)})`; });
  },
  rescale(){ this.place(); },
  focus(c){
    const [x,y]=this.proj([c.lon,c.lat]); const k=Math.max(this.k,4);
    this.svg.transition().duration(450).call(this.zoom.transform, d3.zoomIdentity.translate(this.w/2-k*x, this.h/2-k*y).scale(k));
  },
  markerTip(e,c){
    const ct = c.cts.length? c.cts.map(t=>`${t.t}: ${t.s}`).join('<br>') : 'Sem contrato registrado';
    showTip(e, `<b>${esc(c.n)}</b>${esc(c.cidade||'Cidade a confirmar')} · ${c.uf}<br><span class="tag cart-${c.cart}" style="margin:6px 0">${c.cart}</span><br><span style="color:#5F6B6A">${ct}</span>`, '#mapwrap');
  },
  stateTip(e,d){
    const uf=d.properties.uf; const all=clients.filter(c=>c.uf===uf); if(!all.length){ showTip(e,`<b>${esc(d.properties.nome)}</b>Nenhum cliente`, '#mapwrap'); return; }
    const by={}; all.forEach(c=>by[c.cart]=(by[c.cart]||0)+1);
    showTip(e, `<b>${esc(d.properties.nome)}</b>${all.length} cliente${all.length>1?'s':''}<br>${Object.entries(by).map(([k,v])=>`<span class="sw" style="background:${CART[k].cor};margin-right:5px"></span>${k}: ${v}`).join('<br>')}`, '#mapwrap');
  }
};
function showTip(e,html,wrapSel){ const t=$('#tip'); const r=$(wrapSel).getBoundingClientRect(); t.innerHTML=html; t.style.opacity=1;
  let x=e.clientX-r.left+14, y=e.clientY-r.top+14; const tw=t.offsetWidth, th=t.offsetHeight; if(x+tw>r.width-8) x=e.clientX-r.left-tw-14; if(y+th>r.height-8) y=e.clientY-r.top-th-14;
  t.style.left=x+'px'; t.style.top=y+'px'; }

const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function provHist(c){
  const P=(c.provas||[]).filter(p=>p.i);
  if(!P.length) return null;
  const rounds={}; P.forEach(p=>{ (rounds[p.i]=rounds[p.i]||[]).push(p); });
  const byYear={}; P.forEach(p=>{ const y=p.i.slice(0,4); const o=byYear[y]=byYear[y]||{lotes:0,animais:0,rodadas:new Set()}; o.lotes++; o.animais+=p.a||0; o.rodadas.add(p.i); });
  const years=Object.keys(byYear).sort();
  const yA=years.filter(y=>byYear[y].animais>0); const media=yA.length? yA.reduce((a,y)=>a+byYear[y].animais,0)/yA.length : 0;
  const months=Array(12).fill(0); Object.keys(rounds).forEach(d=>{ months[+d.slice(5,7)-1]++; });
  const mx=Math.max(...months,1); const top=months.map((v,i)=>({v,i})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const hot=new Set(top.filter(x=>x.v>=Math.max(1,mx*0.6)).map(x=>x.i));
  return {P,rounds,byYear,years,yA,media,months,mx,hot,top};
}
function histHTML(c){

function destinations(){
  const caps = CAPS.map(c=>({key:'cap:'+c.uf, uf:c.uf, nome:c.nome, lat:c.latitude, lon:c.longitude, tipo:'capital'}));
  const ex = (S.extraDest||[]).map(d=>({key:'ext:'+d.id, uf:d.uf, nome:d.nome, lat:d.lat, lon:d.lon, tipo:'extra', id:d.id}));
  return [...caps,...ex];
}
function fareFor(dest, origem){
  if(dest.tipo==='extra'){ const d=S.extraDest.find(x=>x.id===dest.id); const v=d?d[origem]:null; return (v===''||v==null)?null:+v; }
  const v=(S.fares[dest.uf]||{})[origem]; return (v===''||v==null)?null:+v;
}
const TOUR_CACHE=new Map();
function tour(start, pts){
  if(!pts.length) return [];
  const key=start.lat.toFixed(4)+','+start.lon.toFixed(4)+'|'+pts.map(p=>p.id+'@'+p.lat.toFixed(3)+','+p.lon.toFixed(3)).sort().join(';');
  const hit=TOUR_CACHE.get(key); if(hit){ const byId={}; pts.forEach(p=>byId[p.id]=p); return hit.map(id=>byId[id]); }
  const res=tour0(start,pts); if(TOUR_CACHE.size>4000) TOUR_CACHE.clear(); TOUR_CACHE.set(key,res.map(p=>p.id)); return res;
}
function tour0(start, pts){
  // vizinho mais próximo + 2-opt, ciclo fechado começando e terminando em start
  let rest=[...pts], cur=start, ord=[];
  while(rest.length){ let bi=0,bd=Infinity; rest.forEach((p,i)=>{ const d=hav(cur,p); if(d<bd){bd=d;bi=i;} }); cur=rest[bi]; ord.push(cur); rest.splice(bi,1); }
  const P=[start,...ord,start];
  let improved=true, guard=0;
  while(improved && guard++<60){ improved=false;
    for(let i=1;i<P.length-2;i++) for(let j=i+1;j<P.length-1;j++){
      const d0=hav(P[i-1],P[i])+hav(P[j],P[j+1]), d1=hav(P[i-1],P[j])+hav(P[i],P[j+1]);
      if(d1+1e-6<d0){ P.splice(i,j-i+1,...P.slice(i,j+1).reverse()); improved=true; }
    } }
  return P.slice(1,-1);
}
function loopKm(start, ord){ if(!ord.length) return 0; let d=hav(start,ord[0]); for(let i=1;i<ord.length;i++) d+=hav(ord[i-1],ord[i]); d+=hav(ord[ord.length-1],start); return d; }
function estimate(r, origem, mode, ov={}){
  const cfg=S.cfg; const P=Math.max(1,+(r.pessoas||cfg.pessoas));
  const pts=r.clientes.map(id=>clients.find(c=>c.id===id)).filter(Boolean);
  const O=ORIGENS[origem];
  let start, fare=0, label, dest=null;
  if(mode.type==='carro'){ start={lat:O.lat,lon:O.lon}; label=`Carro saindo de ${O.nome}`; }
  else { dest=mode.dest; start={lat:dest.lat,lon:dest.lon}; fare=fareFor(dest,origem); if(fare==null) return null; label=`Avião ${O.nome} → ${dest.nome} + carro`; }
  if(ov.fare!=null && ov.fare!=='' && mode.type!=='carro') fare=+ov.fare;
  const ord=tour(start,pts);
  const kmRoad=loopKm(start,ord)*cfg.fatorEstrada;
  const hDrive=kmRoad/cfg.velocidade, hVisit=pts.length*cfg.horasVisita;
  let dias=Math.max(1,Math.ceil((hDrive+hVisit)/cfg.jornada + (mode.type==='aereo'? +cfg.diasVoo:0)));
  if(ov.dias) dias=+ov.dias;
  let noites=Math.max(0,dias-1); if(ov.noites!=null && ov.noites!=='') noites=+ov.noites;
  const quartos=cfg.quartoIndividual?P:Math.ceil(P/2);
  const proprio = mode.type==='carro' && cfg.carroDireto==='proprio';
  const c={
    passagem: mode.type==='aereo'? fare*P : 0,
    carro: proprio? 0 : dias*cfg.carroDiaria,
    combustivel: proprio? kmRoad*cfg.reembolsoKm : kmRoad/cfg.consumo*cfg.combustivel,
    pedagio: kmRoad*cfg.pedagioKm,
    hotel: noites*cfg.hotel*quartos,
    alimentacao: dias*cfg.alimentacao*P,
    outros: dias*(+cfg.outrosDia||0)
  };
  const total=Object.values(c).reduce((a,b)=>a+b,0);
  return {origem, mode, dest, label, start, ord, kmRoad, hDrive, dias, noites, fare, P, custos:c, total, porVisita: pts.length? total/pts.length:0, n:pts.length, proprio};
}
function allOptions(r, origem, ov){
  const out=[]; const car=estimate(r,origem,{type:'carro'},ov); if(car) out.push(car);
  destinations().forEach(d=>{ const e=estimate(r,origem,{type:'aereo',dest:d},ov); if(e) out.push(e); });
  return out.sort((a,b)=>a.total-b.total);
}
function chosen(r, origem){
  const ov=r.ov||{};
  if(r.modo==='carro') return estimate(r,origem,{type:'carro'},ov);
  if(r.modo && r.modo.startsWith('dest:')){ const d=destinations().find(x=>x.key===r.modo.slice(5)); if(d){ const e=estimate(r,origem,{type:'aereo',dest:d},ov); if(e) return e; } }
  return allOptions(r,origem,ov)[0]||null;
}

const RtMap = {
  inited:false, raf:0,
  init(){
    const wrap=$('#rtmapwrap'); const r=wrap.getBoundingClientRect(); this.w=r.width||800; this.h=r.height||360;
    const svg=d3.select('#rtmap').attr('viewBox',`0 0 ${this.w} ${this.h}`); this.svg=svg; svg.selectAll('*').remove();
    this.proj=d3.geoMercator().fitExtent([[20,20],[this.w-20,this.h-20]],GEO); this.path=d3.geoPath(this.proj);

    const ov=svg.append('g'); this.gK=ov.append('g'); this.gC=ov.append('g'); this.gN=ov.append('g');
    this.gS.selectAll('path').data(GEO.features).join('path').attr('class','state').attr('d',this.path);
    const proj=this.proj;
    const kp=this.gK.selectAll('g').data(CAPS).join('g').attr('class','cap-pin').each(function(d){ const p=proj([d.longitude,d.latitude]); this._x=p[0]; this._y=p[1]; });
    kp.append('rect').attr('x',-2.8).attr('y',-2.8).attr('width',5.6).attr('height',5.6).attr('transform','rotate(45)');
    kp.append('text').attr('x',5).attr('dy','0.35em').style('font-size','9px').text(d=>d.nome);
    this.t=d3.zoomIdentity; this.k=1;
    this.zoom=d3.zoom().scaleExtent([1,60]).on('zoom',e=>{ this.t=e.transform; this.k=e.transform.k;
      if(!this.raf) this.raf=requestAnimationFrame(()=>{ this.raf=0; this.g.attr('transform',this.t); this.gS.attr('stroke-width',0.8/this.k); this.place(); }); });
    svg.call(this.zoom); this.inited=true;
  },
  render(est, r){
    if(!this.inited) this.init();
    const proj=this.proj;
    const cl=clients.filter(c=>!r || r.cart==='Ambas' || c.cart===r.cart);

      .each(function(d){ const p=proj([d.lon,d.lat]); this._x=p[0]; this._y=p[1]; })

      .select('title').text(d=>`${d.n} · ${d.cidade||d.uf} (clique para incluir ou tirar)`);
    this.gR.selectAll('*').remove(); this.gN.selectAll('*').remove();
    if(est && est.ord.length){
      const O=ORIGENS[est.origem]; const o=proj([O.lon,O.lat]); const s=proj([est.start.lon,est.start.lat]);
      if(est.mode.type==='aereo'){ this.gR.append('path').attr('class','route-air').attr('d',`M${o[0]},${o[1]} Q${(o[0]+s[0])/2},${Math.min(o[1],s[1])-60} ${s[0]},${s[1]}`); }
      const pts=[est.start,...est.ord,est.start].map(p=>proj([p.lon,p.lat]));
      this.gR.append('path').attr('class','route-line').attr('d',d3.line().curve(d3.curveCatmullRom.alpha(.6))(pts));
      const nodes=est.ord.map((p,i)=>({p:proj([p.lon,p.lat]),i:i+1,c:p}));
      const ng=this.gN.selectAll('g.stop-num').data(nodes).join('g').attr('class','stop-num').each(function(d){ this._x=d.p[0]; this._y=d.p[1]; });
      ng.append('circle').attr('r',9); ng.append('text').text(d=>d.i); ng.append('title').text(d=>`${d.i}. ${d.c.n} · ${d.c.cidade||d.c.uf}`);
      const pin=(x,y,txt)=>{ const g=this.gN.append('g').attr('class','base-pin').each(function(){ this._x=x; this._y=y; }); g.append('circle').attr('r',5); g.append('text').attr('x',8).attr('dy','0.35em').text(txt); };
      pin(o[0],o[1],O.nome);
      if(est.mode.type==='aereo') pin(s[0],s[1],'✈ '+est.dest.nome);
      this.fit([o,...pts]);
    }
    this.place();
  },
  fit(pts){
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);

    this.svg.transition().duration(400).call(this.zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(k));
  },
  place(){ const t=this.t||d3.zoomIdentity;
    const tr=function(){ return `translate(${t.applyX(this._x)},${t.applyY(this._y)})`; };
    this.gK.selectAll('g.cap-pin').attr('transform',tr);
    this.gC.selectAll('circle').attr('cx',function(){return t.applyX(this._x);}).attr('cy',function(){return t.applyY(this._y);});
    this.gN.selectAll('g').attr('transform',tr);
  },
  rescale(){ this.place(); }
};

function kmeans(pts,k){
  let cent=pts.slice().sort((a,b)=>a.lon-b.lon).filter((_,i,arr)=>i%Math.ceil(arr.length/k)===0).slice(0,k).map(p=>({lat:p.lat,lon:p.lon}));
  let asg=[]; for(let it=0;it<20;it++){ asg=pts.map(p=>{ let bi=0,bd=Infinity; cent.forEach((c,i)=>{ const d=hav(p,c); if(d<bd){bd=d;bi=i;} }); return bi; });
    cent=cent.map((c,i)=>{ const m=pts.filter((_,j)=>asg[j]===i); return m.length?{lat:d3.mean(m,x=>x.lat),lon:d3.mean(m,x=>x.lon)}:c; }); }
  return cent.map((_,i)=>pts.filter((_,j)=>asg[j]===i)).filter(g=>g.length);
}
function suggest(cart, origem){
  const pool=clients.filter(c=>c.cart===cart);
  // chave de chegada mais barata para cada cliente sozinho
  const groups={};
  pool.forEach(c=>{ const best=allOptions({clientes:[c.id],pessoas:S.cfg.pessoas,ov:{}},origem,{})[0]; const key=best.mode.type==='carro'?'carro':best.dest.key; (groups[key]=groups[key]||{key,best,items:[]}).items.push(c); });
  let out=[];
  Object.values(groups).forEach(g=>{
    let parts=[g.items];
    if(g.items.length>S.cfg.maxPorRoteiro) parts=kmeans(g.items, Math.ceil(g.items.length/S.cfg.maxPorRoteiro));
    else if(g.key==='carro' && g.items.length>3){ // separa carro em regiões quando muito espalhado
      const spread=d3.max(g.items,a=>d3.max(g.items,b=>hav(a,b))); if(spread>700) parts=kmeans(g.items, Math.ceil(spread/600)); }
    parts.forEach(items=>{ const r={id:null,cart,origem,modo:'auto',pessoas:S.cfg.pessoas,mes:'',clientes:items.map(c=>c.id),ov:{}};
      const e=chosen(r,origem); const ufs=[...new Set(items.map(c=>c.uf))].join(' + ');
      r.nome=`${cart} · ${ufs}`; out.push({r,e}); });
  });
  // junta roteiros de 1 cliente no vizinho mais próximo quando sai mais barato
  let changed=true;
  while(changed){ changed=false;
    for(const s of out.filter(x=>x.r.clientes.length===1)){
      let best=null;
      out.forEach(t=>{ if(t===s) return; const merged={...t.r,clientes:[...t.r.clientes,...s.r.clientes]}; const em=chosen(merged,origem); const gain=(s.e.total+t.e.total)-em.total; if(gain>0 && (!best||gain>best.gain)) best={t,em,gain,merged}; });
      if(best){ best.t.r.clientes=best.merged.clientes; best.t.e=best.em; best.t.r.nome=`${cart} · ${[...new Set(best.t.r.clientes.map(id=>clients.find(c=>c.id===id).uf))].join(' + ')}`; out=out.filter(x=>x!==s); changed=true; break; }
    }
  }
  return out.sort((a,b)=>b.r.clientes.length-a.r.clientes.length);
}

let downloads=null, dlAvailable=true;
function csv(rows){ return '\ufeff'+rows.map(r=>r.map(v=>{ const s=String(v==null?'':v); return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(';')).join('\n'); }
async function save(name,data){
  if(!downloads){ const blob=new Blob([data],{type:name.endsWith('.json')?'application/json':'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Arquivo baixado.'); return; } try{ await downloads.save({filename:name,data}); toast('Arquivo pronto.'); }catch(e){ if(e&&e.code!=='declined'&&e.code!=='cancelled') toast('Não foi possível gerar o arquivo.'); } }
function exportClientes(){ const rows=[['Cliente','Organização','Fazenda','Cidade','UF','Carteira','Carteira original','Solução','Tipo de contrato','Situação','Equipamento','Última prova']];
  filtered().forEach(c=>rows.push([c.n,c.org,c.faz,c.cidade,c.uf,c.cart,c.cartOrig,c.sol,c.tipo,c.sit,c.op,c.ultProva?fmtDate(c.ultProva):c.ultProvaPlan])); save('clientes_carteira.csv',csv(rows)); }
function exportRoteiros(){ const rows=[['Roteiro','Carteira','Mês','Clientes','Saída escolhida','Como chegar','Dias','Diárias','Km de carro','Passagens','Carro','Combustível','Pedágio','Hotel','Alimentação','Outros','Total','Total saindo de Maringá','Total saindo de Viracopos']];
  Object.values(S.roteiros).forEach(r=>{ const e=chosen(r,r.origem), a=chosen(r,'MGF'), b=chosen(r,'VCP'); if(!e) return; const c=e.custos;
    rows.push([r.nome,r.cart,MESES[+r.mes]||'',r.clientes.map(id=>(clients.find(x=>x.id===id)||{}).n).join(', '),ORIGENS[r.origem].nome,e.label,e.dias,e.noites,Math.round(e.kmRoad),...['passagem','carro','combustivel','pedagio','hotel','alimentacao','outros'].map(k=>Math.round(c[k])),Math.round(e.total),a?Math.round(a.total):'',b?Math.round(b.total):'']); });
  save('roteiros_custos.csv',csv(rows)); }

/* =====================================================================
   ACESSO: os dados dos clientes ficam cifrados (AES-GCM) e só abrem com usuário e senha
   ===================================================================== */
const te=new TextEncoder(), td=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function b64e(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
const normUser=u=>String(u||'').trim().toLowerCase();
async function userId(u){ const h=await crypto.subtle.digest('SHA-256',te.encode('ponta-carteira:'+normUser(u))); return b64e(new Uint8Array(h)); }
async function deriveKek(u,p,salt){ const base=await crypto.subtle.importKey('raw',te.encode(normUser(u)+'\u0000'+p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:VAULT.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']); }
async function openData(rawKey){ const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(VAULT.iv)},key,b64d(VAULT.ct)); return JSON.parse(td.decode(pt)); }
async function tryLogin(u,p){
  const id=await userId(u); const rec=VAULT.users.find(x=>x.id===id); if(!rec) return null;
  try{ const kek=await deriveKek(u,p,b64d(rec.salt)); const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(rec.iv)},kek,b64d(rec.wk))); const data=await openData(raw); return {raw,data}; }catch(e){ return null; }
}
const SK='ponta-carteira-sessao';
async function startApp(data,raw){
  DATA_KEY=raw; BASE_CLIENTS=data; $('#login').classList.add('hide'); $('#app').hidden=false;
  if(typeof d3==='undefined'){ $('#app').innerHTML='<div class="empty" style="padding:60px">Não foi possível carregar a biblioteca do mapa. Verifique a internet e recarregue a página.</div>'; return; }
  applyOverrides(); await Store.init();
}

$('#loginForm').onsubmit=async e=>{
  e.preventDefault(); const u=$('#lu').value, p=$('#lp').value; $('#lerr').textContent='';
  if(!u.trim()||!p){ $('#lerr').textContent='Preencha usuário e senha.'; return; }
  $('#lgo').disabled=true; $('#lgo').textContent='Entrando…';
  const r=await tryLogin(u,p);
  $('#lgo').disabled=false; $('#lgo').textContent='Entrar';
  if(!r){ $('#lerr').textContent='Usuário ou senha inválidos.'; $('#lp').value=''; $('#lp').focus(); return; }
  const sess=JSON.stringify({k:b64e(r.raw),u:normUser(u),v:VAULT.iv});

  $('#lp').value=''; startApp(r.data,r.raw);
};

  const fy=document.querySelector('.login .foot'); fy.textContent=`© ${new Date().getFullYear()} Ponta. Todos os direitos reservados.`;
  let sess=null; try{ sess=JSON.parse(sessionStorage.getItem(SK)||localStorage.getItem(SK)||'null'); }catch(e){}

  try{ sessionStorage.removeItem(SK); localStorage.removeItem(SK); }catch(e){}

})();
